name: Experience contracts

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          MD_SAVE_RECOVERY_OUT: ${{ runner.temp }}/modular-diary-save-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-recovery-visuals
          path: ${{ runner.temp }}/modular-diary-save-recovery/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: todo-batch-visuals
          path: /tmp/modular-diary-todo-batch-*/*.png
          if-no-files-found: ignore
