name: Release

# Push a version tag (e.g. `git tag 0.3.0 && git push origin 0.3.0`) to build the
# plugin, attach main.js / manifest.json / styles.css, and attach build provenance
# attestations so the community directory can verify the files came from here.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      # Obsidian mobile has no Node: main.js must load with only `obsidian` available.
      - run: npm run e2e:mobile

      - name: Check the version files match the tag
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME
            const manifest = require("./manifest.json"), versions = require("./versions.json"), pkg = require("./package.json")
            const problems = []
            if (manifest.version !== tag) problems.push(`manifest.json ${manifest.version}`)
            if (pkg.version !== tag) problems.push(`package.json ${pkg.version}`)
            if (versions[tag] !== manifest.minAppVersion) problems.push(`versions.json[${tag}] ${versions[tag]} (minAppVersion ${manifest.minAppVersion})`)
            if (problems.length) { console.error(`tag ${tag} does not match: ${problems.join(", ")}`); process.exit(1) }
          '

      - name: Release notes for this version
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME
            const text = require("fs").readFileSync("RELEASE_NOTES.md", "utf8")
            const start = text.search(new RegExp(`^# ${tag.replace(/\./g, "\\.")}\\b`, "m"))
            if (start < 0) { console.error(`RELEASE_NOTES.md has no "# ${tag}" section`); process.exit(1) }
            const rest = text.slice(start)
            const next = rest.slice(1).search(/^# /m)
            const section = (next < 0 ? rest : rest.slice(0, next + 1)).split("\n").slice(1).join("\n").trim()
            require("fs").writeFileSync("release-notes.md", section + "\n")
          '

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
